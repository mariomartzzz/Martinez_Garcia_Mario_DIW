<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taquilla de entradas digital - Odeon Multicines</title>
    <link rel="stylesheet" type="text/css" href="css/css.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="https://res.cloudinary.com/deunyl3k1/image/upload/s--m6Z3AByL--/c_pad,h_800,w_800/v1/gpla/mall_common/0001/68/15665b2e3eca464742a49b1cd2945d8aba44c51a.png" alt="Logo oficial de Odeon Multicines" width="100">
        </div>

        <div class="header-titulo">
            <h1>Odeon Multicines</h1>
            <p>Venta de entradas digitales</p>
        </div>

        <div class="header-menu">
            <select id="menuNavegacion" onchange="location = this.value;" aria-label="Menú de navegación rápida de la página" title="Menú de navegación">
                <option value="#">Menú</option>
                <option value="#cartelera">Cartelera</option>
                <option value="#reserva">Reservas</option>
                <option value="#contacto">Contacto</option>
            </select>
        </div>
    </header>

    <main>

        <section id="registro">
            <div class="form-container">
                <form action="#" method="POST">
                    <fieldset style="border: none; padding: 0; margin: 0;">
                        <legend style="font-size: 1.7rem; font-weight: bold; margin-bottom: 25px; color: #0f172a; border-bottom: 3px solid #38bdf8; padding-bottom: 5px; display: inline-block;">Registro de usuario</legend>
                        <div class="form-group">
                            <label for="nombre">Nombre completo:</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre" required>
                            <br>
                            <label for="email">Correo Electrónico:</label>
                            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                        </div>
                        
                        <div class="padding-button">
                            <button type="submit">Enviar formulario</button>
                            <button type="reset">Restablecer campos</button>
                        </div>
                    </fieldset>
                </form>
            </div>
        </section>

        <section id="cartelera" class="seccion-cartelera">
            <h2>Cartelera</h2>
            <div class="centrado">
                <img id="principal" src="https://es.web.img3.acsta.net/medias/nmedia/18/83/53/62/19695928.jpg" alt="Póster principal de la película Fast And Furious 5" width="150">
            </div>
            <div class="centrado galeria">
                <img id="Foto1" src="https://thfvnext.bing.com/th/id/OIP.ZfHO8gEK5fIQrIBRBIemigHaK-?w=194&h=288&c=7&r=0&o=7&cb=thfvnext&pid=1.7&rm=3" alt="Póster de la película Avatar: El sentido del agua" width="100">
                <img id="Foto2" src="https://thfvnext.bing.com/th/id/OIP.9kHjYBavvuQxkHvsLmk1DAHaLP?w=194&h=295&c=7&r=0&o=7&cb=thfvnext&pid=1.7&rm=3" alt="Póster de la película Oppenheimer" width="100">
                <img id="Foto3" src="https://thfvnext.bing.com/th/id/OIP.UO_sqbYuVxYyXcZIMOI9zwHaLA?w=194&h=288&c=7&r=0&o=7&cb=thfvnext&pid=1.7&rm=3" alt="Póster de la película Super Mario Bros: La película" width="100">
            </div>
        </section>

        <section id="reserva">
            <fieldset style="border: none; padding: 0; margin: 0;">
                <legend style="font-size: 1.7rem; font-weight: bold; margin-bottom: 25px; color: #0f172a; border-bottom: 3px solid #38bdf8; padding-bottom: 5px; display: inline-block;">Reserva tus entradas</legend>
                <div class="form-grupo">
                    <label for="pelicula">Selecciona la película:</label>
                    <select id="pelicula">
                        <option value="8">Fast And Furious 5 (8€)</option>
                        <option value="10">Avatar: El sentido del agua (10€)</option>
                        <option value="7">Super Mario Bros: La película (7€)</option>
                        <option value="9">Oppenheimer (9€)</option>
                    </select>
                </div>

                <div class="form-grupo">
                    <label for="nEntradas">Número de entradas (máximo 25):</label>
                    <input id="nEntradas" type="number" value="1" min="1" max="25" aria-describedby="ayudaEntradas">
                    <small id="ayudaEntradas" style="display: block; color: #64748b; margin-top: 5px;">Introduce un valor entre 1 y 25.</small>
                </div>

                <div class="caja-total" aria-live="polite">
                    Total a pagar: <span id="precioTotal">8</span>€
                </div>
            </fieldset>
        </section>

        <section id="contacto">
            <h2>Contacto</h2>
            <p>¿Tienes dudas o sugerencias? Escríbenos a <a href="mailto:contacto@odeonmulticines.com" style="color: #0284c7; font-weight: 600;">contacto@odeonmulticines.com</a></p>
        </section>
        
    </main>

    <footer>
        <p>&copy; 2026 Odeon Multicines - Todos los derechos reservados</p>
    </footer>

    <script src="js/js.js"></script>
</body>

</html>
